<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fresh Market - Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css.css" rel="stylesheet">
</head>
<body>
  <header class="border-bottom"><nav class="container navbar navbar-expand-md"><a class="navbar-brand fw-bold" href="index.html">Fresh Market</a><div class="navbar-nav"><a class="nav-link" href="products.html">Products</a><a class="nav-link" href="about.html">About</a><a class="nav-link active" href="contact.html">Contact</a><a class="nav-link" href="dashboard.html">Dashboard</a><a class="nav-link" href="login.html">Login</a></div></nav></header>
  <main class="container py-5">
    <h1>Contact</h1><p>Send us a message. This static page does not submit form data.</p>
    <form class="simple-form">
      <div class="mb-3"><label class="form-label" for="name">Name</label><input class="form-control" id="name" name="name" required></div>
      <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" required></div>
      <div class="mb-3"><label class="form-label" for="message">Message</label><textarea class="form-control" id="message" name="message" rows="4" required></textarea></div>
      <button class="btn btn-success" type="button">Send message</button>
    </form>
  </main>
  <footer class="container border-top py-3">Fresh Market</footer>
</body>
</html>
